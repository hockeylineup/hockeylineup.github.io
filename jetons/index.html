<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Même politique que l'Espace gérant ; le paiement se fait chez Stripe (Checkout), hors de la page. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://wkjyeyswlvdkaalhslvw.supabase.co https://supabase.lautmandam.mywire.org; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>EspaceLigue · Jetons</title>
  <link rel="icon" type="image/png" sizes="192x192" href="../favicon-192.png">
  <link rel="icon" type="image/png" sizes="48x48" href="../favicon-48.png">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="stylesheet" href="../admin/admin.css?v=21">
  <link rel="stylesheet" href="../gerant/gerant.css?v=2">
  <link rel="stylesheet" href="jetons.css?v=4">
  <script src="../commun/langue.js?v=2" defer></script>
  <script src="../commun/en.js?v=2" defer></script>
  <script src="../commun/serveur-en.js?v=1" defer></script>
  <script src="en.js?v=1" defer></script>
  <script src="../commun/session.js?v=3" defer></script>
  <script src="jetons.js?v=6" defer></script>
  <script src="../commun/assistant.js?v=1" defer></script>
  <link rel="stylesheet" href="../commun/assistant.css?v=1">
</head>
<body>
  <main id="connexion" class="connexion" hidden>
    <button id="theme-connexion" class="theme" type="button"></button>
    <button class="langue langue-connexion" type="button"></button>
    <img class="logo" src="../marque/icone-256.png" alt="">
    <h1 data-tr><img class="mot sombre" src="../marque/mot-sombre.svg" alt="EspaceLigue"><img class="mot clair" src="../marque/mot-clair.svg" alt="EspaceLigue"> · Jetons</h1>
    <form id="formulaire-connexion" autocomplete="on">
      <button type="button" id="apple" class="apple" data-tr>
        <svg viewBox="0 0 17 20" aria-hidden="true"><path fill="currentColor" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.5 4.8 1.9 5.8 1 7.4c-1.8 3.2-.5 7.8 1.3 10.4.9 1.3 1.9 2.7 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.6 1-1.5 1.4-2.9 1.4-3-.1 0-2.7-1-2.6-4.2zM11.6 3c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3.1-1.5z"/></svg>
        Continuer avec Apple
      </button>
      <p class="ou" data-tr>ou</p>
      <label data-tr>Courriel <input id="courriel" type="email" autocomplete="username" required></label>
      <label data-tr>Mot de passe <input id="mdp" type="password" autocomplete="current-password" required></label>
      <button type="submit" data-tr>Se connecter</button>
      <p id="erreur-connexion" class="erreur" role="alert"></p>
    </form>
  </main>

  <div id="app" class="coquille" hidden>
    <aside class="cote">
      <div class="marque"><img src="../marque/icone-256.png" alt=""><strong><img class="mot sombre" src="../marque/mot-sombre.svg" alt="EspaceLigue"><img class="mot clair" src="../marque/mot-clair.svg" alt="EspaceLigue"></strong><em data-tr>Jetons</em></div>
      <label id="choix-ligue" hidden data-tr>Ligue <select id="ligue"></select></label>
      <nav id="onglets" aria-label="Sections"></nav>
      <div class="compte">
        <span id="qui" class="doux"></span>
        <div class="compte-actions">
          <button id="theme" class="theme" type="button"></button>
          <button class="langue" type="button"></button>
          <button id="deconnexion" class="discret" data-tr>Se déconnecter</button>
        </div>
      </div>
    </aside>
    <div class="principal">
      <p id="message" class="message" role="status" hidden></p>
      <main id="contenu"></main>
    </div>
  </div>
</body>
</html>
