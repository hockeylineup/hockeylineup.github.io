<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LineUp Hockey</title>
  <meta name="description" content="LineUp : gestion de ligues de hockey — horaire, alignements, absences, remplacements et paiements.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:title" content="LineUp Hockey">
  <meta property="og:description" content="La gestion de ligues de hockey, simplement.">
  <meta property="og:image" content="logo.png">
  <style>
    :root {
      --fond: #0a1428;
      --fond-2: #0f1e3d;
      --texte: #f2f5fa;
      --doux: #9fb0cc;
      --bleu: #1f6fff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(ellipse at top, var(--fond-2), var(--fond) 70%);
      color: var(--texte);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    img.logo {
      width: min(280px, 70vw);
      height: auto;
      border-radius: 22%;
      box-shadow: 0 20px 60px rgba(31, 111, 255, .25);
    }
    h1 { margin: 32px 0 8px; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -.02em; }
    h1 span { color: var(--bleu); }
    p { margin: 0 auto; max-width: 32rem; color: var(--doux); font-size: 1.1rem; line-height: 1.5; }
    .bientot {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 20px;
      border: 1px solid var(--bleu);
      border-radius: 999px;
      color: var(--texte);
      font-weight: 600;
    }
    footer { margin-top: 48px; color: var(--doux); font-size: .85rem; }
  </style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Logo LineUp Hockey">
  <h1>Line<span>Up</span></h1>
  <p>La gestion de ligues de hockey, simplement : horaire, alignements, absences, remplacements et paiements.</p>
  <span class="bientot">Bientôt sur iOS et Android</span>
  <footer>© 2026 LineUp</footer>
</body>
</html>
