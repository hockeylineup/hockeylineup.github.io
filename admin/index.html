<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Rien ne se charge d'ailleurs : aucun script tiers, aucun style en ligne,
       et la page ne parle qu'à Supabase. GitHub Pages ne pose pas d'en-têtes :
       la politique vit ici. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://wkjyeyswlvdkaalhslvw.supabase.co; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>LineUp · Gestion</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="admin.css?v=10">
  <script src="admin.js?v=10" defer></script>
</head>
<body>
  <main id="connexion" class="connexion" hidden>
    <button id="theme-connexion" class="theme" type="button"></button>
    <img class="logo" src="../favicon.png" alt="">
    <h1>Line<span>Up</span> · Gestion</h1>
    <form id="formulaire-connexion" autocomplete="on">
      <button type="button" id="apple" class="apple">
        <svg viewBox="0 0 17 20" aria-hidden="true"><path fill="currentColor" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.5 4.8 1.9 5.8 1 7.4c-1.8 3.2-.5 7.8 1.3 10.4.9 1.3 1.9 2.7 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.6 1-1.5 1.4-2.9 1.4-3-.1 0-2.7-1-2.6-4.2zM11.6 3c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3.1-1.5z"/></svg>
        Continuer avec Apple
      </button>
      <p class="ou">ou</p>
      <label>Courriel <input id="courriel" type="email" autocomplete="username" required></label>
      <label>Mot de passe <input id="mdp" type="password" autocomplete="current-password" required></label>
      <button type="submit">Se connecter</button>
      <p id="erreur-connexion" class="erreur" role="alert"></p>
    </form>
    <section id="approbation" class="approbation" hidden>
      <p>Ouvre LineUp sur ton téléphone et entre ce nombre.</p>
      <p id="nombre" class="nombre"></p>
      <p id="etat-approbation" class="doux" role="status"></p>
      <button type="button" id="reessayer" hidden>Réessayer</button>
      <button type="button" id="utiliser-code" class="discret">Utiliser un code à la place</button>
      <button type="button" id="annuler-approbation" class="discret">Annuler</button>
    </section>
    <form id="formulaire-code" hidden>
      <div id="inscription-totp" hidden>
        <p>Scanne ce code dans ton app d'authentification (Google Authenticator, 1Password, Authy…).</p>
        <img id="qr" class="qr" alt="Code QR de la double authentification">
        <p class="doux">Ou entre la clé : <code id="secret"></code></p>
        <p class="doux">Ensuite, dans l'app : Administration ▸ Approuver depuis ce téléphone.</p>
      </div>
      <label>Code à 6 chiffres <input id="code" inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9]{6}" maxlength="6" required></label>
      <button type="submit">Valider</button>
      <button type="button" id="annuler-code" class="discret">Annuler</button>
      <p id="erreur-code" class="erreur" role="alert"></p>
    </form>
  </main>

  <div id="app" class="coquille" hidden>
    <aside class="cote">
      <div class="marque"><img src="../favicon.png" alt=""><strong>Line<span>Up</span></strong><em>Gestion</em></div>
      <nav id="onglets" aria-label="Sections"></nav>
      <div class="compte">
        <span id="qui" class="doux"></span>
        <div class="compte-actions">
          <button id="theme" class="theme" type="button"></button>
          <button id="deconnexion" class="discret">Se déconnecter</button>
        </div>
      </div>
    </aside>
    <div class="principal">
      <p id="message" class="message" role="status" hidden></p>
      <main id="contenu"></main>
    </div>
  </div>
</body>
</html>
