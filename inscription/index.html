<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://wkjyeyswlvdkaalhslvw.supabase.co https://supabase.lautmandam.mywire.org; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Créer un compte · EspaceLigue</title>
  <meta name="description" content="Crée ton compte EspaceLigue pour gérer ta ligue de hockey ou rejoindre une ligue : horaire, alignements, remplaçants et paiements.">
  <link rel="canonical" href="https://espaceligue.ca/inscription/">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../admin/admin.css?v=13">
  <link rel="stylesheet" href="../gerant/gerant.css?v=1">
  <script src="../commun/session.js?v=1" defer></script>
  <script src="inscription.js?v=1" defer></script>
</head>
<body>
  <main class="connexion">
    <button class="theme" type="button"></button>
    <a href="../"><img class="logo" src="../marque/icone-256.png" alt="EspaceLigue"></a>
    <h1><img class="mot sombre" src="../marque/mot-sombre.svg" alt="EspaceLigue"><img class="mot clair" src="../marque/mot-clair.svg" alt="EspaceLigue"></h1>

    <form id="formulaire" autocomplete="on">
      <h2 class="centre">Créer un compte</h2>
      <button type="button" id="apple" class="apple">
        <svg viewBox="0 0 17 20" aria-hidden="true"><path fill="currentColor" d="M14.1 10.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9C3.5 4.8 1.9 5.8 1 7.4c-1.8 3.2-.5 7.8 1.3 10.4.9 1.3 1.9 2.7 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.6 1-1.5 1.4-2.9 1.4-3-.1 0-2.7-1-2.6-4.2zM11.6 3c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3.1-1.5z"/></svg>
        S'inscrire avec Apple
      </button>
      <p class="ou">ou</p>
      <label>Prénom <input id="prenom" autocomplete="given-name" required maxlength="60"></label>
      <label>Nom <input id="nom" autocomplete="family-name" required maxlength="60"></label>
      <label>Courriel <input id="courriel" type="email" autocomplete="email" required></label>
      <label>Mot de passe <input id="mdp" type="password" autocomplete="new-password" minlength="8" required></label>
      <button type="submit">Créer mon compte</button>
      <p id="erreur" class="erreur" role="alert"></p>
      <p class="doux centre">Déjà un compte ? <a href="../gerant/">Se connecter</a></p>
    </form>

    <form id="confirmation" hidden>
      <h2 class="centre">Vérifie ton courriel</h2>
      <p class="doux centre">Un code a été envoyé à <strong id="adresse"></strong>.</p>
      <label>Code <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,8}" maxlength="8" required></label>
      <button type="submit">Confirmer</button>
      <button type="button" id="renvoyer" class="discret">Renvoyer le code</button>
      <p id="erreur-code" class="erreur" role="alert"></p>
    </form>

    <section id="pret" class="pret" hidden>
      <h2 class="centre">Ton compte est prêt</h2>
      <p class="doux centre">Connecte-toi dans l'app EspaceLigue avec ce compte. Bientôt sur iOS et Android.</p>
      <a class="bouton" href="../gerant/">Ouvrir l'Espace gérant</a>
    </section>
  </main>
</body>
</html>
